name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Generate Flutter scaffold and overlay sources
        run: |
          flutter create --org com.example --project-name skyexp_tools --platforms android app
          cp src/pubspec.yaml app/pubspec.yaml
          rm -rf app/lib && cp -r src/lib app/lib
          rm -rf app/test
          M=app/android/app/src/main
          cp src/AndroidManifest.xml $M/AndroidManifest.xml
          rm -rf $M/kotlin
          mkdir -p $M/kotlin/com/example/skyexp_tools
          cp src/kotlin/com/example/skyexp_tools/*.kt $M/kotlin/com/example/skyexp_tools/
      - name: Build APK
        run: cd app && flutter pub get && flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: skyexp-tools-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
